<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">
<title>Poker Range Trainer</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:40px;
}

#hand{
font-size:42px;
margin:30px;
}

button{
padding:10px 18px;
margin:5px;
font-size:16px;
}

.correct{
color:green;
font-weight:bold;
}

.wrong{
color:red;
font-weight:bold;
}

#stats{
font-size:18px;
margin-bottom:10px;
}

#progressContainer{
width:300px;
height:18px;
background:#ddd;
margin:auto;
border-radius:10px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:#4caf50;
}

</style>

</head>

<body>

<h2>Poker Range Trainer</h2>

<input type="file" id="jsonFile">

<br><br>

Spot :

<select id="spotSelector"></select>

<br><br>

Questions :

<select id="questionCount">
<option value="10">10</option>
<option value="20" selected>20</option>
<option value="30">30</option>
</select>

<br><br>

Mode :

<select id="mode">
<option value="normal">Normal</option>
<option value="frontier">Frontières</option>
</select>

<br><br>

<button onclick="startQuiz()">Start Quiz</button>

<br><br>

<div id="stats">
<span id="counter">0/0</span> |
Score: <span id="liveScore">0</span> |
Errors: <span id="liveErrors">0</span>
</div>

<div id="progressContainer">
<div id="progressBar"></div>
</div>

<div id="hand">-</div>

<div>

<button onclick="answer('raise')">Raise</button> <button onclick="answer('shove')">Shove</button> <button onclick="answer('call')">Call</button> <button onclick="answer('fold')">Fold</button> <button onclick="answer('var')">Var</button>

</div>

<br>

<div id="feedback"></div>

<br>

<div id="result"></div>

<br>

<button onclick="retryErrors()">Redo Errors</button>

<script src="trainer.js"></script>

</body>

</html>
