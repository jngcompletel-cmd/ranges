<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Poker Range Trainer</title>

<style>

body{
font-family:Arial;
text-align:center;
margin-top:40px;
}

#hand{
font-size:40px;
margin:30px;
}

button{
padding:10px 18px;
margin:5px;
font-size:16px;
}

</style>

</head>

<body>

<h2>Poker Range Trainer</h2>

<input type="file" id="jsonFile">

<br><br>

Spot :

<select id="spotSelector"></select>

<br><br>

Questions :

<select id="questionCount">

<option value="10">10</option>
<option value="20" selected>20</option>
<option value="30">30</option>
<option value="50">50</option>

</select>

<br><br>

<button onclick="startQuiz()">Start Quiz</button>

<br><br>

<div id="hand">-</div>

<div>

<button onclick="answer('raise')">Raise</button>
<button onclick="answer('shove')">Shove</button>
<button onclick="answer('call')">Call</button>
<button onclick="answer('fold')">Fold</button>
<button onclick="answer('var')">Var</button>

</div>

<br>

<div id="result"></div>

<br>

<button onclick="retryErrors()">Redo Errors</button>

<script src="trainer.js"></script>

</body>

</html>
