<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Poker Trainer 5 Actions - Import Fichier</title>
<style>
body{ font-family:Arial; text-align:center; }
#hand{ font-size:70px; margin:20px; }
button{ font-size:16px; padding:8px 15px; margin:4px; }
</style>
</head>

<body>

<h2>Spot:
<select id="spotSelector" onchange="changeSpot()">
<option value="BTN_open_25bb">BTN open 25bb</option>
<option value="BTN_shove_10bb">BTN shove 10bb</option>
<option value="SB_vs_BTN_open">SB vs BTN open</option>
<option value="BB_vs_BTN_open">BB vs BTN open</option>
</select>
</h2>

<h2 id="hand"></h2>

<div>
<button onclick="answer('raise')">Raise</button>
<button onclick="answer('shove')">Shove</button>
<button onclick="answer('call')">Call</button>
<button onclick="answer('fold')">Fold</button>
<button onclick="answer('var')">Var</button>
<button onclick="toggleFrontieres()">Frontières</button>
</div>

<h3>Stats</h3>
<p>Total : <span id="total">0</span> | Correct : <span id="correct">0</span> | Accuracy : <span id="accuracy">0</span>%</p>

<h3>Importer / Exporter</h3>
<input type="file" id="jsonFile" accept=".json">
<button onclick="importFile()">Importer le fichier</button>
<button onclick="exportData()">Exporter JSON</button>

<script src="trainer_file.js"></script>
</body>
</html>
